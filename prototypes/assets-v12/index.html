<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asset Coverage Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--bg:#fbfbfa;--ink:#111214;--mute:#6b6f76;--line:#e7e7e4;--card:#fff;--acc:#4b4fd8}
html,body{background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;overflow-x:hidden}
.mono{font-family:'Geist Mono',ui-monospace,monospace}
.eyebrow{font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
h2{font-size:clamp(30px,4.6vw,56px);letter-spacing:-.035em;line-height:1.02;font-weight:600}
.lede{color:var(--mute);font-size:17px;line-height:1.5;max-width:52ch}
.g-logo{display:inline-block;flex:none}
.g-wm{display:inline-grid;place-items:center;flex:none;border-radius:22%;background:#16171a;color:#fff;font-family:'Geist Mono',monospace;font-weight:600;letter-spacing:.02em}
.g-chem{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:22%;border:1.5px solid var(--c);color:var(--c);font-weight:600;letter-spacing:-.02em;background:color-mix(in srgb,var(--c) 8%,#fff)}
.g-chem i{position:absolute;top:8%;left:12%;font-style:normal;font-family:'Geist Mono',monospace;font-weight:500;opacity:.8}
.g-ix{font-family:'Geist Mono',monospace;letter-spacing:-.04em}
.foot{font-size:12px;color:var(--mute);line-height:1.5;max-width:70ch}
.illus{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.static-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.static-grid .st{display:flex;align-items:center;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.static-grid .st b{font-weight:600;font-size:14px;display:block}.static-grid .st span.mono{font-size:11px;color:var(--mute)}

.wrap{max-width:1200px;margin:0 auto;padding:72px 16px 56px}
.intro{display:flex;flex-direction:column;justify-content:flex-end;gap:16px;padding-bottom:28px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.filters{display:inline-flex;padding:4px;border:1px solid var(--line);border-radius:99px;background:#fff;position:relative;flex-wrap:wrap}
.filters button{position:relative;z-index:1;border:0;background:none;font:500 13px 'Geist',sans-serif;color:var(--mute);padding:8px 14px;border-radius:99px;cursor:pointer;transition:color .3s}
.filters button[aria-pressed=true]{color:#fff}
.filters .pill{position:absolute;z-index:0;top:4px;left:4px;height:calc(100% - 8px);border-radius:99px;background:var(--ink)}
.count{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;perspective:1400px}
.tile{position:relative;height:200px;cursor:pointer;outline:none;border-radius:20px}
.tile[hidden]{display:none}
.tile:focus-visible{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.nt .flip{transition:none}
.tile.flipped .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;background:#fff;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;overflow:hidden}
.front::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 14%,transparent),transparent 70%)}
.front .cls{font-family:'Geist Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.front .gl{margin:auto 0 14px}
.front .nm{font-size:19px;font-weight:600;letter-spacing:-.02em}
.front .row{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px;font-family:'Geist Mono',monospace;font-size:12px;color:var(--mute)}
.front .row b{color:var(--ink);font-weight:500}
.back{transform:rotateY(180deg);background:#121317;color:#fff;border-color:#121317}
.back .tk{display:flex;justify-content:space-between;font-family:'Geist Mono',monospace;font-size:12px;color:#a9abb3}
.back .tk b{color:#fff;font-weight:500}
.back svg{width:100%;height:70px;margin:auto 0 10px;overflow:visible}
.back .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.back .chips span{font-family:'Geist Mono',monospace;font-size:10px;padding:4px 9px;border-radius:99px;border:1px solid #33353d}
.back .chips span.l{border-color:#2f7d58;color:#6fe0a8}.back .chips span.s{border-color:#7d2f3a;color:#ff8f9c}
.back .illus{color:#80838c;margin-left:auto}
.fn{margin-top:40px;border-top:1px solid var(--line);padding-top:16px}
.static-grid{display:none}
@media (prefers-reduced-motion: reduce){.grid,.bar{display:none}.static-grid{display:grid}}
@media (max-width:540px){.grid{grid-template-columns:repeat(2,1fr);gap:10px}.tile{height:172px}.face{padding:14px}.front .nm{font-size:16px}.front .row{font-size:11px}}
</style></head><body>
<section class="wrap" aria-labelledby="t">
 <div class="intro"><p class="eyebrow">Asset coverage</p><h2 id="t">Fourteen markets.<br>One rulebook.</h2><p class="lede">Equities, the US Tech 100 and global commodities, traded systematically in both directions. Flip a tile to see the shape of the market.</p></div>
 <div class="bar">
  <div class="filters" role="group" aria-label="Filter assets"><span class="pill" aria-hidden="true"></span>
   <button aria-pressed="true" data-f="all">All</button><button aria-pressed="false" data-f="eq">Equities</button><button aria-pressed="false" data-f="ix">Index</button><button aria-pressed="false" data-f="cm">Commodities</button></div>
  <span class="count"><span id="count" aria-live="polite">14 markets</span> · * prices illustrative</span>
 </div>
 <div class="grid" id="grid"></div>
 <div class="static-grid" id="sg"></div>
 <p class="foot fn">Prices and charts are illustrative only, not live market data. <span id="fn"></span></p>
</section>
<script type="module">
import { animate, stagger, svg, utils } from 'https://cdn.jsdelivr.net/npm/animejs@4.5.0/+esm';
// ---- shared asset data + glyphs ----
const ASSETS = [
  {id:'nvda', name:'NVIDIA', tk:'NVDA', cls:'eq', logo:'nvidia', c:'#76B900', p:182.40},
  {id:'tsla', name:'Tesla', tk:'TSLA', cls:'eq', logo:'tesla', c:'#CC0000', p:248.10},
  {id:'aapl', name:'Apple', tk:'AAPL', cls:'eq', logo:'apple', c:'#000000', p:231.55},
  {id:'msft', name:'Microsoft', tk:'MSFT', cls:'eq', wm:'MSFT', c:'#1f2328', p:428.30},
  {id:'amzn', name:'Amazon', tk:'AMZN', cls:'eq', wm:'AMZN', c:'#1f2328', p:196.75},
  {id:'googl', name:'Alphabet', tk:'GOOGL', cls:'eq', logo:'google', c:'#4285F4', p:171.20},
  {id:'meta', name:'Meta', tk:'META', cls:'eq', logo:'meta', c:'#0467DF', p:584.90},
  {id:'ndx', name:'US Tech 100', tk:'US100', cls:'ix', g:'100', c:'#3b3f9e', p:20145.0},
  {id:'xau', name:'Gold', tk:'XAU', cls:'cm', g:'chem', sym:'Au', z:79, c:'#b8892b', p:2654.3},
  {id:'xag', name:'Silver', tk:'XAG', cls:'cm', g:'chem', sym:'Ag', z:47, c:'#7d8794', p:31.42},
  {id:'wti', name:'WTI crude', tk:'WTI', cls:'cm', g:'drop', c:'#2a2a2a', p:71.85},
  {id:'brent', name:'Brent crude', tk:'BRENT', cls:'cm', g:'drop2', c:'#4a3b2a', p:75.60},
  {id:'ng', name:'Natural gas', tk:'NG', cls:'cm', g:'flame', c:'#2f7de1', p:2.74},
  {id:'cu', name:'Copper', tk:'HG', cls:'cm', g:'chem', sym:'Cu', z:29, c:'#b06a3b', p:4.31},
];
const CLS = {eq:'US equity', ix:'Index', cm:'Commodity'};
const FOOT = 'Company names and logos are trademarks of their respective owners. Aether Quant is not affiliated with or endorsed by them.';

function glyph(a, size = 28) {
  const s = `width:${size}px;height:${size}px`;
  if (a.logo) return `<span class="g-logo" style="${s};background:${a.c};-webkit-mask:url(logos/${a.logo}.svg) center/contain no-repeat;mask:url(logos/${a.logo}.svg) center/contain no-repeat" role="img" aria-label="${a.name} logo"></span>`;
  if (a.wm) return `<span class="g-wm" style="${s};font-size:${size*0.3}px" aria-hidden="true">${a.wm}</span>`;
  if (a.g === 'chem') return `<span class="g-chem" style="${s};--c:${a.c};font-size:${size*0.5}px" aria-hidden="true"><i style="font-size:${size*0.2}px">${a.z}</i>${a.sym}</span>`;
  if (a.g === '100') return `<span class="g-chem g-ix" style="${s};--c:${a.c};font-size:${size*0.36}px" aria-hidden="true">100</span>`;
  if (a.g === 'flame') return `<svg aria-hidden="true" style="${s}" viewBox="0 0 24 24"><path fill="${a.c}" d="M12 2c.6 3.3-1.2 5-2.8 6.9C7.6 10.8 6 12.7 6 15.4 6 19 8.7 22 12 22s6-3 6-6.6c0-2.6-1.3-4.7-2.7-6.2-.2 1.5-.9 2.6-2 3.1.4-3.4-.4-7.7-1.3-10.3z"/><path fill="#fff" opacity=".85" d="M12 21c-1.6 0-3-1.3-3-3.1 0-1.7 1.4-2.6 2.3-4 .3 1 .9 1.6 1.7 1.8 1 .3 2 1.1 2 2.3C15 19.7 13.6 21 12 21z"/></svg>`;
  // oil drops (WTI solid, Brent with inner band)
  return `<svg aria-hidden="true" style="${s}" viewBox="0 0 24 24"><path fill="${a.c}" d="M12 2.5C9.5 6.4 5.5 10.6 5.5 14.6A6.5 6.5 0 0 0 12 21.5a6.5 6.5 0 0 0 6.5-6.9c0-4-4-8.2-6.5-12.1z"/>${a.g==='drop2'?'<path d="M7.2 15.2h9.6" stroke="#fff" stroke-width="1.6" opacity=".8"/>':''}<path d="M9 14.6a3 3 0 0 0 2.4 3.2" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round" opacity=".7"/></svg>`;
}

function rng(seed) { let s = 0; for (const ch of seed) s = (s * 31 + ch.charCodeAt(0)) >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
function series(a, n = 40) { const r = rng(a.id); let v = 0; const out = []; for (let i = 0; i < n; i++) { v += (r() - 0.47) * 1.6; out.push(v); } return out; }
function sparkPath(a, w = 120, h = 36) {
  const d = series(a), mn = Math.min(...d), mx = Math.max(...d);
  return d.map((v, i) => `${i ? 'L' : 'M'}${(i / (d.length - 1) * w).toFixed(1)},${(h - 3 - (v - mn) / (mx - mn || 1) * (h - 6)).toFixed(1)}`).join('');
}
function fmtP(a) { return a.p >= 1000 ? a.p.toLocaleString('en-US', {maximumFractionDigits: 0}) : a.p.toFixed(2); }
function chg(a) { const d = series(a); return ((d[d.length - 1] - d[d.length - 8]) * 0.6).toFixed(2); }
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

document.getElementById('fn').textContent = FOOT;
document.getElementById('sg').innerHTML = ASSETS.map(a => `<div class="st" tabindex="0">${glyph(a,32)}<div><b>${a.name}</b><span class="mono">${a.tk} · ${CLS[a.cls]}</span></div></div>`).join('');
const grid = document.getElementById('grid');
const lineCol = a => (a.c === '#000000' || a.wm || a.id === 'wti') ? '#ffffff' : a.c;
grid.innerHTML = ASSETS.map(a => {
  const c = +chg(a);
  return `<div class="tile" tabindex="0" role="button" aria-pressed="false" data-cls="${a.cls}" data-id="${a.id}" style="--c:${a.c}" aria-label="${a.name}, ${a.tk}, ${CLS[a.cls]}. Press to flip.">
  <div class="flip">
   <div class="face front"><span class="cls">${CLS[a.cls]}</span><div class="gl">${glyph(a, 44)}</div><div class="nm">${a.name}</div>
    <div class="row"><span>${a.tk}</span><span><b>${fmtP(a)}</b> <span title="Illustrative price">*</span></span></div></div>
   <div class="face back" aria-hidden="true"><div class="tk"><b>${a.tk}</b><span style="color:${c>=0?'#6fe0a8':'#ff8f9c'}">${c>=0?'+':''}${c}%</span></div>
    <svg viewBox="0 0 120 36" preserveAspectRatio="none"><path d="${sparkPath(a)}" fill="none" stroke="${lineCol(a)}" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>
    <div class="chips"><span class="l">Long</span><span class="s">Short</span><span class="illus">Illustrative</span></div></div>
  </div></div>`;
}).join('');
const tiles = [...grid.children];

// flip
const drawn = new WeakSet();
function setFlip(t, on) {
  t.classList.toggle('flipped', on); t.setAttribute('aria-pressed', on);
  if (on) {
    const p = t.querySelector('.back path');
    animate(svg.createDrawable(p), {draw: ['0 0', '0 1'], duration: 1000, delay: 250, ease: 'inOutQuad'});
    animate(t.querySelectorAll('.back .chips span'), {opacity: [0, 1], translateY: [8, 0], delay: stagger(70, {start: 450}), duration: 400});
  }
}
tiles.forEach(t => {
  t.addEventListener('pointerenter', e => e.pointerType === 'mouse' && setFlip(t, true));
  t.addEventListener('pointerleave', e => e.pointerType === 'mouse' && setFlip(t, false));
  t.addEventListener('click', e => { if (e.pointerType !== 'mouse') setFlip(t, !t.classList.contains('flipped')); });
  t.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setFlip(t, !t.classList.contains('flipped')); } });
  t.addEventListener('blur', () => setFlip(t, false));
});

// assemble from scattered on scroll into view
if (!REDUCED) {
  tiles.forEach(t => { t.style.opacity = 0; });
  const io = new IntersectionObserver(es => {
    if (!es.some(e => e.isIntersecting)) return;
    io.disconnect();
    animate(tiles, {
      opacity: [0, 1],
      translateX: [() => utils.random(-260, 260), 0],
      translateY: [() => utils.random(80, 340), 0],
      rotate: [() => utils.random(-28, 28), 0],
      scale: [() => utils.random(55, 85) / 100, 1],
      delay: stagger(60, {grid: [4, 4], from: 'center'}),
      duration: 1100, ease: 'outExpo'
    });
  }, {threshold: .15});
  io.observe(grid);
}

// filter with FLIP
const btns = [...document.querySelectorAll('.filters button')], pill = document.querySelector('.filters .pill');
function movePill(b, instant) {
  const r = b.getBoundingClientRect(), pr = b.parentElement.getBoundingClientRect();
  animate(pill, {translateX: r.left - pr.left - 4, translateY: r.top - pr.top - 4, width: r.width, duration: instant ? 0 : 500, ease: 'outElastic(1,.8)'});
}
movePill(btns[0], true); addEventListener('resize', () => movePill(btns.find(b => b.getAttribute('aria-pressed') === 'true'), true));
const ORDER = {eq: 0, ix: 1, cm: 2};
function applyFilter(f) {
  const first = new Map(tiles.map(t => [t, t.getBoundingClientRect()]));
  const wasHidden = new Map(tiles.map(t => [t, t.hidden]));
  const keep = t => f === 'all' || t.dataset.cls === f;
  // re-sort: matches first, by class then a playful rotation of order per filter
  const sorted = [...tiles].sort((a, b) => (ORDER[a.dataset.cls] - ORDER[b.dataset.cls]) || (f === 'all' ? 0 : (a.dataset.id < b.dataset.id ? -1 : 1)));
  sorted.forEach(t => { t.hidden = !keep(t); grid.appendChild(t); });
  sorted.forEach(t => {
    if (t.hidden) return;
    const l = t.getBoundingClientRect(), fr = first.get(t);
    if (wasHidden.get(t)) { animate(t, {opacity: [0, 1], scale: [.6, 1], translateX: 0, translateY: 0, rotate: 0, duration: 600, delay: 120, ease: 'outBack(1.4)'}); return; }
    animate(t, {translateX: [fr.left - l.left, 0], translateY: [fr.top - l.top, 0], scale: [1, 1], opacity: 1, rotate: 0, duration: 750, ease: 'outQuint'});
  });
  document.getElementById('count').textContent = `${sorted.filter(keep).length} market${sorted.filter(keep).length > 1 ? 's' : ''}`;
}
btns.forEach(b => b.addEventListener('click', () => {
  btns.forEach(x => x.setAttribute('aria-pressed', x === b)); movePill(b); applyFilter(b.dataset.f);
}));
const demo = new URLSearchParams(location.search);
if (demo.get('f')) setTimeout(() => btns.find(b => b.dataset.f === demo.get('f')).click(), 1800);
if (demo.get("flip")) setTimeout(() => { grid.classList.add("nt"); }, 1700), setTimeout(() => tiles.filter((t, i) => i % 3 === 0).forEach(t => setFlip(t, true)), 1800);
</script></body></html>
