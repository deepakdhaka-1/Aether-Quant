<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glass Layers — Aether Quant v07</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#24223b;--mut:#6f6b8c;--up:#12946a;--dn:#e0475b;--acc:#6b5cf0}
html,body{margin:0;background:#fbfaff;color:var(--ink);font-family:Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#scroll{height:430vh;position:relative}
#stage{position:sticky;top:0;height:100vh;width:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%}
#brand{position:absolute;left:28px;top:24px;font-weight:600;font-size:15px;letter-spacing:-.01em}
#step{position:absolute;right:28px;top:24px;font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut)}
#bar{position:absolute;left:0;top:0;height:2px;background:var(--acc);width:0}
#cap{position:absolute;left:50%;bottom:5.5vh;transform:translateX(-50%);width:min(860px,90vw);text-align:center;font-size:clamp(18px,1.9vw,27px);font-weight:500;letter-spacing:-.015em;line-height:1.25}
#cap span{display:inline-block;white-space:pre}
#note{position:absolute;right:28px;bottom:22px;font-size:11px;color:var(--mut)}
#hint{position:absolute;left:28px;bottom:22px;font-size:11px;color:var(--mut)}
@media (max-width:900px){#cap{bottom:3vh;font-size:17px}#note,#hint{display:none}#brand{left:16px}#step{right:16px}}
</style>
</head>
<body>
<div id="scroll"><div id="stage">
  <canvas id="c"></canvas>
  <div id="bar"></div>
  <div id="brand">Aether Quant</div>
  <div id="step">01 / 07</div>
  <div id="cap"></div>
  <div id="hint">Scroll</div>
  <div id="note">Illustrative numbers</div>
</div></div>
<script type="module">
let A=null;
try{A=await import('https://cdn.jsdelivr.net/npm/animejs@4.5.0/+esm');}catch(e){}

const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const seg=(p,a,b)=>cl((p-a)/(b-a));
const lerp=(a,b,t)=>a+(b-a)*t;
const E={
  o3:t=>1-Math.pow(1-t,3),
  io3:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  oX:t=>t>=1?1:1-Math.pow(2,-10*t),
  oB:t=>{const c1=1.5,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)},
};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- data ---------- */
const N=60,HI=14;
const C=[];{const r=rng(11);let p=118.4;
for(let i=0;i<N;i++){const d=i<5?.05:i<30?.95:i<55?-1.1:-.35;const o=p;let c=o+d+(r()-.5)*2.6,h=Math.max(o,c)+r()*1.3+.2,l=Math.min(o,c)-r()*1.3-.2,v=.35+r()*.5+Math.abs(c-o)*.12;
if(i===HI){c=o+2.7;h=c+.95;l=o-1.55;v=.92}
if(i===N-1){c=o-1.6;h=o+.5;l=c-.6;v=.95}
C.push({o,h,l,c,v:Math.min(1,v)});p=c;}}
const ema=n=>{const k=2/(n+1);let e=C[0].c;return C.map(x=>e=x.c*k+e*(1-k))};
const EM=[ema(9),ema(21),ema(50)];
const EMC=['107,92,240','232,150,40','40,140,210'];
let pmin=1e9,pmax=-1e9;C.forEach(x=>{pmin=Math.min(pmin,x.l);pmax=Math.max(pmax,x.h)});pmin-=2;pmax+=2;
const hero=C[HI];
const UP='18,148,106',DN='224,71,91',ACC='107,92,240',INK='36,34,59';
const fams=['EMA','SMA','RSI','MACD','ATR','Bollinger %B','Volume flow','Stoch','CCI','ADX','ROC','Williams %R','Keltner','Donchian','MFI','OBV slope','VWAP gap','Momentum'];
const lens=[5,7,9,12,14,20,21,26,30,50,100,200];
const NAMES=['EMA 9','EMA 21','EMA 50'];{let k=0;while(NAMES.length<124){const f=fams[k%fams.length],n=lens[(k*5+Math.floor(k/fams.length))%lens.length];const s=f+' '+n;if(!NAMES.includes(s))NAMES.push(s);k++;}}
const val=(j,k)=>{if(j<3)return EM[j][k].toFixed(2);const f=Math.sin(j*12.9898+k*.37)*.5+Math.sin(k*.21+j)*.5;return (j%3===0?(50+f*35).toFixed(1):(f*2.4).toFixed(2))};
const FR=['EMA 9 crosses above EMA 21','EMA 9 crosses below EMA 21','RSI < 70','RSI > 30','price below EMA 50','price above EMA 50','MACD turns up','MACD turns down','ATR rising','Bollinger %B > 1','volume flow > 0','ADX > 25','Stoch < 20','breaks 20-bar low','breaks 20-bar high','RSI < 30'];
const COMBOS=[];for(let a=0;a<FR.length;a++)for(let b=0;b<FR.length;b++)if(a!==b&&(a*7+b)%5===0)COMBOS.push([FR[a],FR[b],(a+b)%2?'SHORT':'LONG']);
const NC=24,BEST=13,SECOND=5;
const CANDS=[];{const r=rng(5);for(let j=0;j<NC;j++){const side=j===BEST?'SHORT':j===SECOND?'LONG':(r()<.5?'LONG':'SHORT');
const good=j===BEST||j===SECOND;const drift=good?(j===BEST?.055:.035):(r()-.62)*.06;let e=1,pts=[];for(let k=0;k<34;k++){e+=drift+(r()-.5)*(good?.06:.16);pts.push(e)}
const why=['drawdown −48%','Sharpe 0.21','only 9 trades','fails on unseen data','loses after fees'][j%5];
CANDS.push({side,pts,good,label:j===BEST?'EMA 9 below EMA 21 + price below EMA 50':j===SECOND?'EMA 9 above EMA 21 + RSI < 70':FR[(j*3)%16],why,sh:good?(j===BEST?'Sharpe 1.4':'Sharpe 0.9'):why})}}

/* ---------- canvas ---------- */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();
const F=()=>cl(W/1440,.62,1.15);
const font=(w,s,m)=>ctx.font=`${w} ${Math.round(s*F())}px ${m?"'Geist Mono'":'Geist'}`;
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,Math.min(r,w/2,h/2))}
function glass(x,y,w,h,o={}){const{r=18,a=1,blur=0,tint=null,ta=.42}=o;if(a<=.004||w<1||h<1)return;
  ctx.save();ctx.globalAlpha*=a;if(blur>.3)ctx.filter=`blur(${blur.toFixed(1)}px)`;
  ctx.shadowColor='rgba(70,60,130,.12)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
  rr(x,y,w,h,r);ctx.fillStyle=`rgba(255,255,255,${ta})`;ctx.fill();ctx.shadowColor='transparent';
  if(tint){ctx.fillStyle=tint;ctx.fill()}
  const g=ctx.createLinearGradient(x,y,x+w*.5,y+h);g.addColorStop(0,'rgba(255,255,255,.7)');g.addColorStop(.4,'rgba(255,255,255,.1)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fill();
  ctx.lineWidth=1.3;ctx.strokeStyle='rgba(255,255,255,.95)';ctx.stroke();
  rr(x+.6,y+.6,w-1.2,h-1.2,r);ctx.strokeStyle='rgba(90,80,150,.14)';ctx.lineWidth=1;ctx.stroke();ctx.restore()}
function txt(s,x,y,o={}){const{a=1,c=INK,w=500,sz=13,m=false,al='left',bl='alphabetic'}=o;if(a<=.004)return;ctx.save();ctx.globalAlpha*=a;font(w,sz,m);ctx.fillStyle=`rgb(${c})`;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y);ctx.restore()}
function wrap(s,maxW){const ws=s.split(' ');const out=[];let line='';for(const w of ws){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t}out.push(line);return out}
function glassBar(x,y,w,h,col,o={}){const a=o.a??1;if(h<0){y+=h;h=-h}h=Math.max(h,1.5);ctx.save();ctx.globalAlpha*=a;rr(x,y,w,h,Math.min(w*.18,8));ctx.fillStyle=`rgba(${col},.2)`;ctx.fill();
  const g=ctx.createLinearGradient(x,0,x+w,0);g.addColorStop(0,'rgba(255,255,255,.65)');g.addColorStop(.35,'rgba(255,255,255,.05)');g.addColorStop(1,'rgba(255,255,255,.25)');ctx.fillStyle=g;ctx.fill();
  ctx.strokeStyle=`rgba(${col},.9)`;ctx.lineWidth=o.lw||1.4;ctx.stroke();ctx.restore()}
function line(x1,y1,x2,y2,col,a=1,lw=1.4,dash){ctx.save();ctx.globalAlpha*=a;ctx.strokeStyle=`rgb(${col})`;ctx.lineWidth=lw;if(dash)ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}

function bg(t){ctx.fillStyle='#fbfaff';ctx.fillRect(0,0,W,H);
  [[.15,.2,'230,224,255'],[.85,.25,'255,226,216'],[.62,.9,'218,244,234'],[.12,.88,'255,240,212'],[.5,.5,'240,236,255']].forEach((b,i)=>{
  const x=W*(b[0]+Math.sin(t*.00017+i*2)*.03),y=H*(b[1]+Math.cos(t*.00013+i)*.03),r=Math.max(W,H)*.5;
  const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${b[2]},.9)`);g.addColorStop(1,`rgba(${b[2]},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,W,H)})}

/* chart mapping */
const lr=(a,b,t)=>({x:lerp(a.x,b.x,t),y:lerp(a.y,b.y,t),w:lerp(a.w,b.w,t),h:lerp(a.h,b.h,t)});
const cy_=(pr,R)=>R.y+R.h*.07+(1-(pr-pmin)/(pmax-pmin))*R.h*.7;
const cx_=(i,R)=>R.x+R.w*.04+(i+.5)*(R.w*.92/N);
const cw_=R=>R.w*.92/N*.62;

function drawSeries(R,o={}){const a=o.a??1;if(a<=.004)return;ctx.save();ctx.globalAlpha*=a;if(o.blur>.3)ctx.filter=`blur(${o.blur.toFixed(1)}px)`;
  const w=cw_(R);for(let i=0;i<N;i++){const k=o.app?o.app(i):1;if(k<=.004)continue;const d=C[i],up=d.c>=d.o,col=up?UP:DN;
    const x=o.pos?o.pos(i,k):cx_(i,R);ctx.save();ctx.globalAlpha*=Math.min(1,k);
    line(x,cy_(d.h,R),x,cy_(d.l,R),col,.85,Math.max(1,w*.14));
    const t=cy_(Math.max(d.o,d.c),R),b=cy_(Math.min(d.o,d.c),R);
    if(o.simple){ctx.fillStyle=`rgba(${col},.55)`;ctx.fillRect(x-w/2,t,w,Math.max(1.5,b-t))}else glassBar(x-w/2,t,w,b-t,col,{lw:1.1});
    const vh=R.h*.14*d.v;ctx.fillStyle=`rgba(${ACC},.16)`;ctx.fillRect(x-w/2,R.y+R.h*.97-vh,w,vh);ctx.restore()}
  if(o.ema)EM.forEach((e,j)=>{const up=Math.floor(o.ema[j]);if(up<1)return;ctx.save();ctx.strokeStyle=`rgb(${EMC[j]})`;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=Math.min(N-1,up);i++){const x=cx_(i,R),y=cy_(e[i],R);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.restore()});
  ctx.restore()}

/* hero big mapping */
function big(){const cx=W/2,cy=H*.42,bh=H*.42;return{cx,cy,bh,bw:Math.min(W*.075,112),Y:pr=>cy-bh/2+(1-(pr-hero.l)/(hero.h-hero.l))*bh}}
function drawPart(part,B,ta){const{cx,bw,Y}=B;const d=hero;
  if(part==='high'){glassBar(cx-bw*.07,Y(d.h),bw*.14,Y(d.c)-Y(d.h),UP);ctx.fillStyle=`rgb(${UP})`;ctx.beginPath();ctx.arc(cx,Y(d.h),5,0,7);ctx.fill();txt(d.h.toFixed(2),cx+16,Y(d.h)+4,{m:1,a:ta,sz:14,c:UP})}
  if(part==='low'){glassBar(cx-bw*.07,Y(d.o),bw*.14,Y(d.l)-Y(d.o),UP);ctx.fillStyle=`rgb(${UP})`;ctx.beginPath();ctx.arc(cx,Y(d.l),5,0,7);ctx.fill();txt(d.l.toFixed(2),cx+16,Y(d.l)+4,{m:1,a:ta,sz:14,c:UP})}
  if(part==='body'){glassBar(cx-bw/2,Y(d.c),bw,Y(d.o)-Y(d.c),UP,{lw:1.8})}
  if(part==='open'){line(cx-bw*.95,Y(d.o),cx-bw*.5,Y(d.o),INK,.35+.65*ta,2.4);txt(d.o.toFixed(2),cx-bw*1.02,Y(d.o)+4,{m:1,a:ta,sz:14,al:'right'})}
  if(part==='close'){line(cx+bw*.5,Y(d.c),cx+bw*.95,Y(d.c),INK,.35+.65*ta,2.4);txt(d.c.toFixed(2),cx+bw*1.02,Y(d.c)+4,{m:1,a:ta,sz:14})}
  if(part==='vol'){const vh=H*.09*d.v,y0=B.cy+B.bh/2+H*.13;glassBar(cx-bw/2,y0-vh,bw,vh,ACC)}}
const PARTS=[['high','High','The top price in that hour.'],['open','Open','The first price in that hour.'],['body','Body','Open to close. Green means it went up.'],['close','Close','The last price in that hour.'],['low','Low','The bottom price in that hour.'],['vol','Volume','How much was traded.']];

/* ---------- frame ---------- */
const STOPS=[0,.1,.26,.4,.56,.7,.86];
const CAPS=['This is one hour of NVIDIA’s price.','Each candle holds four prices and a volume.','Hour after hour, candles become a chart. Up, then down.','On every candle we compute 100+ indicators.','A research engine combines them into rules, long and short. Testing 1,240 combinations…','Each rule is backtested. Most fail. The best survive.','The winner places an order with a stop-loss, on your own account.'];
const capEl=document.getElementById('cap'),stepEl=document.getElementById('step'),barEl=document.getElementById('bar');
let capIdx=-1;
function setCap(i){if(i===capIdx)return;capIdx=i;stepEl.textContent=`0${i+1} / 07`;
  capEl.innerHTML=CAPS[i].split(' ').map(w=>`<span>${w} </span>`).join('');
  const sp=capEl.querySelectorAll('span');
  if(A&&A.animate){try{A.animate(sp,{opacity:[0,1],translateY:[14,0],filter:['blur(6px)','blur(0px)'],duration:700,delay:A.stagger(28),ease:'outExpo'});return}catch(e){}}
  sp.forEach(s=>s.style.opacity=1)}

function frame(p,t){ctx.setTransform(DPR,0,0,DPR,0,0);bg(t);
  const B=big();const bob=Math.sin(t*.0012)*3;
  const R0={x:W*.12,y:H*.12,w:W*.76,h:H*.6},R1={x:W*.05,y:H*.13,w:W*.56,h:H*.58},R2={x:W*.35,y:H*.12,w:W*.6,h:H*.62};
  const m=E.io3(seg(p,.25,.33));
  const q=E.io3(seg(p,.39,.46));
  const r=E.io3(seg(p,.55,.61));
  const b=E.io3(seg(p,.69,.75));
  const L=E.io3(seg(p,.85,.91));

  /* stage 1-2: hero + anatomy sheets */
  if(m<=0){const sc=cl(W*.8/6/260/1.15,.3,.6);const gap=260*sc*1.18;
    for(let i=0;i<6;i++){const ex=E.io3(seg(p,.08+i*.012,.15+i*.012))*(1-E.io3(seg(p,.22+(5-i)*.006,.26+(5-i)*.006)));
      const sx=lerp(B.cx,B.cx+(i-2.5)*gap,ex),sy=lerp(B.cy,B.cy+(i-2.5)*H*.012-H*.04,ex)+bob*(1-ex*.5)+Math.sin(t*.0011+i)*2*ex,s=lerp(1,sc,ex);
      ctx.save();ctx.translate(sx,sy);ctx.rotate((i-2.5)*.025*ex);ctx.scale(s,s);ctx.translate(-B.cx,-B.cy);
      const py=B.cy-B.bh/2-H*.06,ph=B.bh+H*.06+H*.17;glass(B.cx-130,py,260,ph,{a:ex,r:26,ta:.35});
      drawPart(PARTS[i][0],B,ex);ctx.restore();
      const ly=sy+(py+ph-B.cy)*s+26*F();const la=E.o3(seg(ex,.6,1));
      txt(PARTS[i][1],sx,ly,{a:la,w:600,sz:15,al:'center'});font(400,12.5);const ls=wrap(PARTS[i][2],gap*.92);ls.forEach((s2,k)=>txt(s2,sx,ly+19*F()*(k+1),{a:la*.85,w:400,sz:12.5,al:'center',c:'95,91,124'}))}
  }
  /* stage 3: series */
  if(m>0){
    let R=lr(R0,R1,q);R=lr(R,R2,L);
    const dim=r*(1-L),ca=(1-dim*.8)*cl(m*1.6);const cblur=dim*7;
    // ghost depth copies
    const ga=m*(1-q);for(let k=3;k>=1;k--){if(ga<=0)break;ctx.save();const cxr=R.x+R.w/2,cyr=R.y+R.h/2;ctx.translate(cxr+k*W*.03,cyr-k*H*.045);ctx.scale(1-.05*k,1-.05*k);ctx.translate(-cxr,-cyr);
      glass(R.x,R.y,R.w,R.h,{a:ga*(.6-.15*k),blur:k*1.8,r:26,ta:.3});drawSeries(R,{a:ga*(.5-.12*k),blur:k*1.8,simple:1});ctx.restore()}
    glass(R.x,R.y,R.w,R.h,{a:ca,r:26,ta:.38,blur:cblur});
    const hx=lerp(B.cx,cx_(HI,R),m);
    const cur=Math.round(lerp(10,N-1,seg(p,.42,.53)));
    const emaUp=q>0?EM.map((_,j)=>lerp(0,cur,E.o3(seg(p,.44+j*.015,.5+j*.015)))):null;
    const emaFull=L>0?[N-1,N-1,N-1]:emaUp;
    drawSeries(R,{a:ca,blur:cblur,simple:R.w<W*.4,ema:p>.53?[N-1,N-1,N-1]:emaFull,
      app:i=>i===HI?1:seg(p,.29+Math.abs(i-HI)/N*.07,.32+Math.abs(i-HI)/N*.07),
      pos:(i,k)=>lerp(hx,cx_(i,R),E.o3(k))});
    // morphing hero overlay (big -> small)
    if(m<1){const d=hero,Y=pr=>lerp(B.Y(pr),cy_(pr,R),m),w=lerp(B.bw,cw_(R),m);ctx.save();ctx.globalAlpha=1;
      line(hx,Y(d.h),hx,Y(d.l),UP,.9,lerp(B.bw*.14,2,m));glassBar(hx-w/2,Y(d.c),w,Y(d.o)-Y(d.c),UP,{lw:1.6});ctx.restore()}
    // cursor during indicators
    if(q>0&&p<.56){const x=cx_(cur,R);line(x,R.y+12,x,R.y+R.h-12,ACC,.5*q,1,[3,4]);txt('candle '+(cur+1),x,R.y+R.h-16,{a:q*.8,sz:11,m:1,al:'center',c:ACC})}
    if(m>.2&&q<1){txt('NVIDIA · 1-hour candles',R.x+22,R.y+30,{a:(m-.2)*(1-q)*1.2,w:500,sz:13,c:'95,91,124'})}
    // live signal
    if(L>0){const sg=E.oB(seg(p,.9,.94)),d=C[N-1],x=cx_(N-1,R);const stop=d.h+2.2;
      line(cx_(N-14,R),cy_(stop,R),x+16,cy_(stop,R),DN,sg,1.4,[5,4]);txt('Stop-loss '+stop.toFixed(2),cx_(N-14,R),cy_(stop,R)-8,{a:sg,sz:12,m:1,c:DN});
      const ay=cy_(d.l,R)+14+(1-sg)*20;ctx.save();ctx.globalAlpha=sg;ctx.fillStyle=`rgb(${DN})`;ctx.beginPath();ctx.moveTo(x,ay);ctx.lineTo(x-8,ay+12);ctx.lineTo(x+8,ay+12);ctx.closePath();ctx.translate(0,0);ctx.restore();
      ctx.save();ctx.globalAlpha=sg;rr(x-34,ay+2,52,22,11);ctx.fillStyle=`rgb(${DN})`;ctx.fill();ctx.restore();txt('Short',x-8,ay+17,{a:sg,c:'255,255,255',w:600,sz:12,al:'center'});
      const tk=E.oB(seg(p,.92,.97));const tw=Math.max(W*.19,210),tx=R.x+R.w-tw-18,ty=R.y+18+(1-tk)*16;
      glass(tx,ty,tw,H*.19,{a:tk,r:18,ta:.7});const rows=[['Order','Short NVDA'],['Entry','market'],['Stop-loss',stop.toFixed(2)],['Account','yours, on Hyperliquid']];
      txt('Order sent',tx+18,ty+28,{a:tk,w:600,sz:15});rows.slice(1).forEach((rw,k)=>{txt(rw[0],tx+18,ty+56+k*22*F(),{a:tk,sz:12.5,c:'111,107,140',w:400});txt(rw[1],tx+tw-18,ty+56+k*22*F(),{a:tk,sz:12.5,m:1,al:'right',c:k===1?DN:INK})})}
  }

  /* stage 4: indicator stack */
  const M=124;
  if(q>0&&b<1){const Fw=W*.3,Fh=H*.5,Fx=W*.65,Fy=H*.22;const cur=Math.round(lerp(10,N-1,seg(p,.42,.53)));
    const items=[];
    for(let j=M-1;j>=0;j--){const d=j/(M-1),dp=Math.pow(d,.7);const sl=E.oX(seg(p,.39+d*.05,.45+d*.05));if(sl<=0)continue;
      const s=1-.6*dp;let cx=Fx+Fw/2+dp*W*.06+(1-sl)*W*.6,cy=Fy+Fh/2-dp*H*.2+Math.sin(t*.001+j*.3)*1.5;
      let w=Fw*s,h=Fh*s,a=(.15+.85*(1-d))*sl,bl=d*2.5,isCard=j>=1&&j<=36;
      if(r>0){if(isCard){const ci=j-1;const rj=E.io3(seg(p,.55+ci*.0012,.6+ci*.0012));
          const ph=seg(p,.57,.71)*Math.PI*1.7+t*.00008;const th=ci/36*Math.PI*2+ph;const z=(Math.sin(th)+1)/2;
          const kx=W/2+Math.cos(th)*W*.36,ky=H*.4+Math.sin(th)*H*.11,ks=.55+.45*z;const cw=W*.15,ch=H*.11;
          let rej=(ci%3===1)?E.io3(seg(p,.61+(ci%12)*.005,.65+(ci%12)*.005)):0;
          // backtest grid
          let gx=kx,gy=ky,gw=cw*ks,gh=ch*ks,gbl=(1-z)*4,ga=1-rej*.75;
          if(ci<NC&&b>0){const bj=E.io3(seg(p,.69+ci*.0018,.74+ci*.0018));const col=ci%8,row=Math.floor(ci/8),gap=W*.012;const cw2=(W*.86-7*gap)/8,ch2=H*.15;
            const tx=W*.07+col*(cw2+gap)+cw2/2,ty=H*.2+row*(ch2+gap*1.6)+ch2/2;gx=lerp(gx,tx,bj);gy=lerp(gy,ty,bj);gw=lerp(gw,cw2,bj);gh=lerp(gh,ch2,bj);gbl=lerp(gbl,0,bj);ga=lerp(ga,1,bj)}
          else if(b>0){ga*=1-b}
          cx=lerp(cx,gx,rj);cy=lerp(cy,gy,rj);w=lerp(w,gw,rj);h=lerp(h,gh,rj);a=lerp(a,ga,rj);bl=lerp(bl,gbl,rj);
          items.push({j,ci,cx,cy,w,h,a,bl,z:rj>.5?(b>0?2:z):-d,rej,rj});continue}
        else{a*=1-r;bl+=r*6}}
      if(j===0){a*=1-r}
      items.push({j,cx,cy,w,h,a,bl,z:-d})}
    items.sort((u,v)=>u.z-v.z);
    for(const it of items){if(it.a<=.004)continue;const {j,cx,cy,w,h}=it;const x=cx-w/2,y=cy-h/2;
      if(it.ci!==undefined&&it.rj>0){drawCard(it,p,t);continue}
      glass(x,y,w,h,{a:it.a,blur:it.bl,r:16*Math.max(.5,w/Fw),ta:j===0?.62:.22});
      if(j>0&&j<14&&it.bl<2)txt(NAMES[j]+'  '+val(j,cur),x+12,y+18,{a:it.a*.75,sz:10.5,m:1,c:'95,91,124'});
      if(j===0){drawGrid(x,y,w,h,cur,it.a)}}
    const cnt=Math.round(lerp(0,124,E.o3(seg(p,.4,.47))));txt(cnt+' indicators, updated every candle',Fx,Fy-18,{a:q*(1-r),w:500,sz:13,c:'95,91,124'});
  }
  /* research counter + rule panel */
  if(r>0&&b<1){const k=seg(p,.57,.71);const n=Math.round(lerp(0,1240,k));const a=r*(1-b);
    txt(`Testing ${n.toLocaleString('en-US')} combinations…`,W/2,H*.13,{a,sz:14,m:1,al:'center',c:ACC});
    const co=COMBOS[Math.floor(k*60)%COMBOS.length];const pw=Math.min(W*.6,720),px=W/2-pw/2,py=H*.62;
    glass(px,py,pw,H*.1,{a,r:20,ta:.7});font(500,16);
    txt('If  '+co[0]+'  and  '+co[1],px+24,py+H*.05+6,{a,sz:16,w:500});
    rr(px+pw-90,py+H*.05-13,70,26,13);ctx.save();ctx.globalAlpha=a;ctx.fillStyle=`rgb(${co[2]==='LONG'?UP:DN})`;ctx.fill();ctx.restore();
    txt(co[2]==='LONG'?'Long':'Short',px+pw-55,py+H*.05+5,{a,sz:13,w:600,al:'center',c:'255,255,255'})}
  /* checks */
  const fw=E.io3(seg(p,.79,.84));
  if(fw>0){const ck=['Tested on unseen data','Sharpe ≥ 0.5','Drawdown no worse than −35%','15+ trades','Fees included'];
    let x=lerp(W*.58,W*.05,L),y=lerp(H*.3,H*.55,L);const a=fw;
    ck.forEach((s,k)=>{const ka=E.oB(seg(p,.8+k*.008,.83+k*.008));const yy=y+k*28*F();ctx.save();ctx.globalAlpha=a*ka;ctx.fillStyle=`rgb(${UP})`;ctx.beginPath();ctx.arc(x+8,yy-4,8,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x+4,yy-4);ctx.lineTo(x+7,yy-1);ctx.lineTo(x+12,yy-8);ctx.stroke();ctx.restore();txt(s,x+24,yy+1,{a:a*ka,sz:14,w:500})})}
}

function drawGrid(x,y,w,h,cur,a){txt('Candle '+(cur+1),x+18,y+28,{a,w:600,sz:14});txt('124 values',x+w-18,y+28,{a,sz:11,m:1,al:'right',c:'111,107,140'});
  const cols=3,rows=13,cw=(w-36)/cols,rh=(h-56)/rows;for(let k=0;k<cols*rows;k++){const c=k%cols,rw=Math.floor(k/cols);const j=rw*cols+c;const xx=x+18+c*cw,yy=y+52+rw*rh+rh*.7;
    const hl=j<3;if(hl){ctx.save();ctx.globalAlpha=a;rr(xx-4,yy-rh*.72,cw-6,rh*.95,5);ctx.fillStyle=`rgba(${EMC[j]},.14)`;ctx.fill();ctx.restore()}
    txt(NAMES[j],xx,yy,{a:a*(hl?1:.7),sz:10.5,c:hl?EMC[j]:'95,91,124',w:hl?600:400});txt(val(j,cur),xx+cw-12,yy,{a:a*(hl?1:.7),sz:10.5,m:1,al:'right',c:hl?EMC[j]:INK})}}

function drawCard(it,p,t){const c=CANDS[it.ci]||{label:FR[it.ci%16],side:it.ci%2?'SHORT':'LONG',pts:[],good:false};
  let {cx,cy,w,h,a,bl}=it;const ci=it.ci;const isG=ci<NC;
  const bq=E.io3(seg(p,.69,.75));
  let fail=0;if(isG&&!c.good){fail=E.io3(seg(p,.765+(ci%12)*.002,.8+(ci%12)*.002))}
  const L=E.io3(seg(p,.85,.91));const fw=E.io3(seg(p,.79,.84));
  if(fail>0){cy+=fail*H*.07;w*=1-.14*fail;h*=1-.14*fail;bl+=fail*7;a*=1-.78*fail;a*=1-L}
  if(isG&&ci===BEST&&fw>0){const tw=lerp(W*.3,W*.27,L),th=lerp(H*.3,H*.28,L);const tx=lerp(W*.33,W*.05+tw/2,L),ty=lerp(H*.42,H*.27,L);cx=lerp(cx,tx,fw);cy=lerp(cy,ty,fw);w=lerp(w,tw,fw);h=lerp(h,th,fw)}
  if(isG&&ci===SECOND){a*=1-L;if(fw>0){bl+=fw*1.5;a*=1-fw*.3}}
  if(a<=.004)return;const x=cx-w/2,y=cy-h/2;const s=w/(W*.15);
  glass(x,y,w,h,{a,blur:bl,r:14,ta:.55,tint:it.rej>0?`rgba(${DN},${.08*it.rej})`:null});
  ctx.save();if(bl>.3)ctx.filter=`blur(${bl.toFixed(1)}px)`;
  const fs=cl(s,.6,2);
  if(bq<.5||!isG){txt(FR[ci%16],x+12*fs,y+h/2+4,{a:a*(1-it.rej*.5)*(isG?1-bq*2:1),sz:12*fs,w:500});}
  else{const ka=a*(bq-.5)*2;const big=ci===BEST&&fw>0;
    const side=c.side;rr(x+10*fs,y+10*fs,46*fs,18*fs,9*fs);ctx.save();ctx.globalAlpha=ka;ctx.fillStyle=`rgba(${side==='LONG'?UP:DN},.14)`;ctx.fill();ctx.restore();
    txt(side==='LONG'?'Long':'Short',x+33*fs,y+23*fs,{a:ka,sz:10.5*fs,w:600,al:'center',c:side==='LONG'?UP:DN});
    txt(c.sh,x+w-10*fs,y+23*fs,{a:ka,sz:10.5*fs,m:1,al:'right',c:c.good?UP:fail>0?DN:'111,107,140'});
    if(big||w>W*.2){ctx.save();font(500,13*fs/1.4);txt(c.label,x+12*fs,y+46*fs,{a:ka*fw,sz:12*fs/1.1,w:500});ctx.restore()}
    const dp=seg(p,.72,.78);const pts=c.pts,n=Math.max(2,Math.floor(pts.length*dp));const mn=Math.min(...pts,.6),mx=Math.max(...pts,1.6);
    const gx=x+10*fs,gw=w-20*fs,gy=y+h*.42,gh=h*.48;ctx.globalAlpha=ka;ctx.strokeStyle=`rgb(${pts[pts.length-1]>=1?UP:DN})`;ctx.lineWidth=1.6*Math.min(fs,1.6);ctx.beginPath();
    for(let k=0;k<n;k++){const xx=gx+k/(pts.length-1)*gw,yy=gy+gh-(pts[k]-mn)/(mx-mn)*gh;k?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
    ctx.setLineDash([2,3]);ctx.strokeStyle='rgba(36,34,59,.2)';ctx.lineWidth=1;const by=gy+gh-(1-mn)/(mx-mn)*gh;ctx.beginPath();ctx.moveTo(gx,by);ctx.lineTo(gx+gw,by);ctx.stroke()}
  ctx.restore()}

/* ---------- scroll + loop ---------- */
const qp=new URLSearchParams(location.search).get('p');
let target=0,cur=0,locked=qp!==null;
function readScroll(){const max=document.documentElement.scrollHeight-innerHeight;return max>0?cl(scrollY/max):0}
if(locked){target=cur=cl(parseFloat(qp)||0);requestAnimationFrame(()=>{const max=document.documentElement.scrollHeight-innerHeight;scrollTo(0,target*max)})}
addEventListener('scroll',()=>{const v=readScroll();if(locked&&Math.abs(v-target)<.002)return;locked=false;target=v},{passive:true});
function loop(t){cur+=(target-cur)*.12;if(Math.abs(target-cur)<1e-4)cur=target;
  frame(cur,t);let si=0;STOPS.forEach((s,i)=>{if(cur>=s)si=i});setCap(si);barEl.style.width=(cur*100)+'%';
  document.getElementById('hint').style.opacity=cur>.02?0:1;requestAnimationFrame(loop)}
await document.fonts?.ready;requestAnimationFrame(loop);
</script>
